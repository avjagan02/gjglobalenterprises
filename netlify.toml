# netlify.toml

[build]
  command = ""
  publish = "/"

[dev]
  command = "http-server"
  port = 8000

# Clean URL redirects (no .html in the address bar)
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/trade"
  to = "/trade.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Legacy hash-anchor URLs from previous single-page version
[[redirects]]
  from = "/products"
  to = "/trade.html#products"
  status = 301

[[redirects]]
  from = "/scm"
  to = "/services.html#scm"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache settings
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/Gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/picture/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
